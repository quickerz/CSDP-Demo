name: UFT AOS Test

on:
  workflow_dispatch:

env:
  PROPS_TXT: FT-test-props.txt
  RES_XML: FT-test-results.xml
  LAUNCHER_EXE: FTToolsLauncher.exe
  LAUNCHER_URL: https://github.com/MicroFocus/ADM-FT-ToolsLauncher/releases/download/v24.2.0/FTToolsLauncher_net48.exe
  UFT_TEST_PATH: 'C:\Users\demo\Documents\Functional Testing\AOS'

jobs:
  run-tests:
    runs-on: [self-hosted, ft-runner]

    steps:
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "UFT Test: $env:UFT_TEST_PATH"

          if (Test-Path $env:UFT_TEST_PATH) {
            Write-Host "AOS UFT test found."
          } else {
            Write-Error "AOS UFT test NOT found at $env:UFT_TEST_PATH"
            exit 1
          }

      - name: Create UFT properties file
        shell: powershell
        run: |
          $escapedTestPath = $env:UFT_TEST_PATH.Replace('\', '\\')
          $content = @"
          runType=FileSystem
          resultsFilename=$env:RES_XML
          Test1=$escapedTestPath
          resultTestNameOnly=true
          resultUnifiedTestClassname=true
          "@

          $content | Out-File -FilePath $env:PROPS_TXT -Encoding utf8

          Write-Host "Created UFT properties file:"
          Get-Content $env:PROPS_TXT

      - name: Download Functional Testing launcher
        shell: powershell
        run: |
          if (Test-Path $env:LAUNCHER_EXE) {
            Write-Host "FTToolsLauncher.exe already exists."
          } else {
            Write-Host "Downloading FTToolsLauncher.exe..."
            Invoke-WebRequest -Uri $env:LAUNCHER_URL -OutFile $env:LAUNCHER_EXE
          }

      - name: Run AOS UFT test
        id: run-tests
        shell: powershell
        run: |
          $process = Start-Process -FilePath "$env:LAUNCHER_EXE" `
            -ArgumentList "-paramfile $env:PROPS_TXT" `
            -NoNewWindow -PassThru

          $process | Wait-Process

          Write-Host "FTToolsLauncher exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Archive UFT test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uft-aos-test-results
          path: FT-test-results.xml
        continue-on-error: true
